# PostgreSQL 配置文件 - 针对4GB内存服务器优化
# 用于 pgvector + arXiv 元数据存储

# ===================== 内存配置 =====================
# 共享缓冲区 - 小内存设小一点，让更多内存给OS缓存
shared_buffers = 512MB

# 有效缓存大小 - 告诉查询优化器系统有多少缓存可用
effective_cache_size = 2GB

# 单个查询工作内存
work_mem = 64MB

# 维护操作内存（VACUUM, CREATE INDEX等）
maintenance_work_mem = 256MB

# ===================== 连接配置 =====================
max_connections = 20

# ===================== WAL配置 =====================
# 预写日志设置，平衡性能和持久性
wal_buffers = 16MB
max_wal_size = 1GB
min_wal_size = 512MB

# ===================== 查询优化器 =====================
random_page_cost = 1.1          # SSD优化，如果使用HDD改为4.0
seq_page_cost = 1.0
default_statistics_target = 100

# ===================== 日志配置 =====================
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000ms  # 记录超过1秒的查询

# ===================== 扩展配置 =====================
# pgvector 相关
shared_preload_libraries = 'pg_stat_statements'

# ===================== 其他优化 =====================
# 禁用 full_page_writes 如果是SSD且能接受一点风险（可选）
# full_page_writes = off

# 自动清理
autovacuum = on
autovacuum_max_workers = 2
