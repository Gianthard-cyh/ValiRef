server:
  http_listen_port: 9080
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: valiref-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: valiref
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      # 解析 Docker JSON 格式
      - json:
          expressions:
            log: log
            stream: stream
            attrs: attrs
      # 从 attrs 提取容器名
      - json:
          expressions:
            container_name: "['io.docker.compose.service']"
          source: attrs
      # 设置标签
      - labels:
          container_name:
          stream:
      # 输出日志内容
      - output:
          source: log
