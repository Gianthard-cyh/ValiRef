server:
  http_listen_port: 9080
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container_name'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service_name'
    pipeline_stages:
      # Docker 日志是 JSON，提取 log 和 stream 字段
      - json:
          expressions:
            log: log
            stream: stream
      # 从应用日志中提取 level 作为标签（低基数）
      - json:
          source: log
          expressions:
            level: level
      # 将 level 和 stream 作为标签用于过滤
      - labels:
          level:
          stream:
      # 输出完整的 structlog JSON（保留所有字段）
      - output:
          source: log
