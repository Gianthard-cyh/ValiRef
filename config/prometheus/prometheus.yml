global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'valiref-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  - job_name: 'valiref-worker'
    static_configs:
      - targets: ['host.docker.internal:8001']
    scrape_interval: 5s
