[project]
name = "valiref"
version = "0.1.0"
description = "AI-Powered Citation Validation for Academic Papers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "0xfe", email = "2953427626@qq.com"}
]
keywords = ["academic", "citations", "hallucination", "validation", "ai", "llm", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
dependencies = [
    "arxiv>=2.4.0",
    "asyncpg>=0.29.0",
    "blinker>=1.9.0",
    "ddgs>=9.10.0",
    "google-search-results>=2.4.2",
    "httpx>=0.28.1",
    "langchain>=1.2.10",
    "langchain-deepseek>=1.0.1",
    "langgraph>=1.0.8",
    "langsmith>=0.7.1",
    "openreview-py>=1.57.0",
    "psycopg2-binary>=2.9.11",
    "pymupdf>=1.27.1",
    "python-dotenv>=1.2.1",
    "ratelimit>=2.2.1",
    "rich>=14.3.2",
    "scholarly>=1.7.11",
    "semanticscholar>=0.11.0",
    "sentence-transformers>=2.2.0",
    "socksio>=1.0.0",
    "tqdm>=4.66.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/Gianthard-cyh/ValiRef"
Repository = "https://github.com/Gianthard-cyh/ValiRef"
Documentation = "https://github.com/Gianthard-cyh/ValiRef#readme"
Issues = "https://github.com/Gianthard-cyh/ValiRef/issues"

[project.scripts]
valiref = "src.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "twine>=6.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."
python_files = "test_*.py"
markers = [
    "integration: marks tests as integration tests (slow, requires network)",
]
addopts = "-v -m 'not integration'"
