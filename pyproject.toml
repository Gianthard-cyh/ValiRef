[project]
name = "valiref"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.4.0",
    "blinker>=1.9.0",
    "duckduckgo-search>=8.1.1",
    "google-search-results>=2.4.2",
    "httpx>=0.28.1",
    "langchain>=1.2.10",
    "langgraph>=1.0.8",
    "openreview-py>=1.57.0",
    "pymupdf>=1.27.1",
    "python-dotenv>=1.2.1",
    "ratelimit>=2.2.1",
    "rich>=14.3.2",
    "scholarly>=1.7.11",
    "semanticscholar>=0.11.0",
    "socksio>=1.0.0",
    "typer>=0.9.0",
]

[dependency-groups]
dev = [
    "langchain-deepseek>=1.0.1",
    "ruff>=0.15.1",
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = "."
python_files = "test_*.py"
markers = [
    "integration: marks tests as integration tests (slow, requires network)",
]
addopts = "-v -m 'not integration'"
