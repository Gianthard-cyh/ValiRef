# Database Admin Tools
# pgAdmin4 for PostgreSQL management
# Usage: docker-compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml -f docker-compose.db-admin.yml up -d

services:
  pgadmin:
    image: dpage/pgadmin4:8.4
    container_name: valiref-pgadmin
    ports:
      - "${PGADMIN_PORT:-8084}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@valiref.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    networks:
      - valiref-network
    restart: unless-stopped

volumes:
  pgadmin_data:

# 复用已有网络
networks:
  valiref-network:
    external: true
